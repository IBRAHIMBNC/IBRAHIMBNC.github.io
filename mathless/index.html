<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathless</title>
<meta name="description" content="Mathless — splitting expenses, without the math.">
<style>
  :root{
    --bg:#F4F4F0;--ink:#111111;--muted:#555555;--card:#FFFFFF;
    --line:rgba(17,17,17,.12);--focus:#111111;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#111111;--ink:#F4F4F0;--muted:#A6A6A0;--card:#1C1C1B;--line:rgba(244,244,240,.14);--focus:#D4FF3A;}
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.5;display:flex;min-height:100vh;align-items:center;justify-content:center;
  }
  .wrap{max-width:420px;width:100%;padding:48px 16px;text-align:center;}
  h1{font-size:20px;margin:0 0 12px;font-weight:700;}
  p{margin:0 0 28px;}
  ul{list-style:none;margin:0;padding:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;}
  li + li{border-top:1px solid var(--line);}
  li a{display:block;padding:14px 16px;color:var(--ink);text-decoration:none;font-weight:600;}
  li a span{display:block;font-weight:400;font-size:14px;color:var(--muted);}
  .muted{font-size:13px;color:var(--muted);margin:28px 0 0;}
  .muted a{color:var(--muted);}
  a:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mathless</h1>
  <p>Splitting expenses, without the math.</p>
  <ul>
    <li><a href="/mathless/privacy/">Privacy policy<span>What the app collects and who handles it</span></a></li>
    <li><a href="/mathless/terms/">Terms of use<span>The short rules for using Mathless</span></a></li>
    <li><a href="/mathless/delete-account/">Delete your account<span>Remove your account without the app</span></a></li>
  </ul>
  <p class="muted">Questions? <a href="mailto:imibrahimnisar@gmail.com">imibrahimnisar@gmail.com</a></p>
</div>
</body>
</html>
